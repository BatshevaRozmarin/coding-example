on:
  push:
    branches:
      - calculator

jobs:
  test-lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: calculator-shevi/tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
